name: Claude PR Review (Fable)

# Automatic second-opinion review with Claude Fable when a pull request is
# opened. The review comments, it does not block: it is not a required check,
# so a failed review run never holds up a merge.
#
# Prerequisite: repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings -> Secrets
# -> Actions). The token comes from the Claude subscription: run
# `claude setup-token` locally, copy the token, store it as the secret. It is
# valid for one year and usage counts against the subscription. Alternative
# with separate pay-per-token billing: a Console API key as ANTHROPIC_API_KEY
# and `anthropic_api_key:` as input instead of the env variable.
# The managed Claude Code review service does not allow choosing the model,
# hence this workflow with an explicit `--model claude-fable-5`.
#
# The setup mirrors planback/.github/workflows/claude-pr-review.yml (which in
# turn mirrors redumio) and keeps the lessons learned there:
# - only `opened` and `ready_for_review`, not `synchronize`: one review per
#   PR opening keeps cost predictable. For a re-review after fixes, set the PR
#   to draft and back, or add `synchronize` here.
# - no `branches` filter: the diff at opening time is exactly the PR's own
#   delta.
# - the summary goes out as a pull request review (`gh pr review --comment`),
#   not as `gh pr comment`. An issue comment never appears as a review.
#   The allowlist entry is deliberately the long prefix
#   `Bash(gh pr review --comment:*)` and not `Bash(gh pr review:*)`: the short
#   form would also permit `--approve`, and a reviewer that can approve its own
#   findings defeats the point of the second opinion. `--approve` and
#   `--request-changes` are additionally on the deny list.
# - a PR that CHANGES THIS FILE gets no review. The action compares the file
#   against the copy on the default branch (main) and refuses to run when they
#   differ, so that a pull request cannot rewrite the reviewer to leak the
#   token. The job still reports success - it warns and exits 0 - so a green
#   "Fable Review" check does not by itself prove that a review happened. Look
#   for "Workflow validation failed" in the log. The new version takes effect
#   for the PRs that come after the merge.
# - draft and dependabot PRs are skipped (bot runs do not see the secret).
# - subagents are disabled: a run once started background agents, ended its
#   turn, and the job cleaned them up before any comment was posted.
# - max-turns 100 is a backstop, not a budget. Read-only git/gh are allowed so
#   the reviewer can diff against the base without wasting turns on refused
#   tool calls.
#
# This workflow needs no access to the `production` environment and none of
# the deploy secrets; it runs with the repository token plus the Claude token.

on:
  pull_request:
    types: [opened, ready_for_review]

# id-token: write is required. The action exchanges a GitHub OIDC token for a
# token of the Claude GitHub App to post comments on the PR.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

# One review run per PR at a time; a new one replaces a running one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Fable Review
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Skip cleanly while the secret is not set up yet instead of failing the
      # check. Secrets cannot be tested in a job-level `if`, so a step does it.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, skipping the Fable review. See the comment at the top of this workflow."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          # Full history so the reviewer can diff against the base branch.
          fetch-depth: 0

      - name: Claude Code Review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        # Subscription auth: the OAuth token goes in as an env variable (NOT as
        # a `with` input, unlike anthropic_api_key).
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          # Show the transcript in the Actions log (private repo). Without it a
          # failed run cannot be diagnosed, e.g. which tool calls were refused.
          show_full_output: true
          prompt: |
            Review this pull request as a strict second reviewer. Read
            README.md first: it describes how the site is built and served.
            Write all comments in English.

            This repository is the static website of PlanBack: plain HTML and
            CSS under `site/`, no build step. A merge to `main` deploys `site/`
            by rsync to the server, where Caddy serves it from a read-only
            bind mount. There is no JavaScript framework, no cookies, no
            external services, and the privacy statement promises exactly
            that.

            Check these especially carefully:

            1. Deploy safety: `.github/workflows/deploy.yml` deploys on merge
               to `main`. Any change to a workflow that widens triggers, adds
               secrets, changes the rsync target or the `--delete` behaviour,
               or weakens the `production` environment gate is a finding. The
               security boundary is the environment rule, not a check in the
               file; a PR must not claim otherwise.

            2. Page layout contract: sub pages live as `<name>/index.html` so
               URLs work without `.html` (the Caddy block has no try_files).
               A new page as `<name>.html`, a link to a path that does not
               exist under `site/`, or a missing entry for `404.html` is a
               finding. Assets are referenced with absolute paths from the
               site root.

            3. Privacy and legal texts: `datenschutz/` and `impressum/` carry
               the provider details and must stay `noindex`. Anything that
               adds an external resource (CDN font, analytics, embedded map,
               third-party script, external image) contradicts the privacy
               statement and needs a matching text change. Draft markers
               (`.draft`, `<span class="todo">`) must not survive into a PR
               meant for `main`. The "Stand:" date must be updated when a
               legal text changes.

            4. HTML and CSS correctness: unclosed tags, duplicate ids, broken
               `href`/`src`, missing `alt` on images, missing `lang` and meta
               viewport, inline styles that bypass `site/assets/page.css`,
               colours that deviate from the corporate design (Forest Green
               #124737, Process Teal #18A0A5, Bread Gold #F5A53E), fonts other
               than the self-hosted Inter.

            5. Content: the site is German. Flag obvious typos, broken
               umlauts or encoding errors, and claims about the product that
               contradict the README's description of the pages.

            Procedure: get the overview first (diff and affected files), then
            post EARLY the ONE summary as a pull request review, with the most
            important findings sorted by severity. Use exactly this command,
            with --comment as the FIRST flag and the number LAST:

              gh pr review --comment --body "<your summary>" ${{ github.event.pull_request.number }}

            The flag order is not cosmetic: the sandbox only allows commands
            starting with "gh pr review --comment", so any other order is
            refused. Do not use gh pr comment (that posts a plain issue
            comment, which does not show up as a review), and never --approve
            or --request-changes - reviewing is your job, deciding is not.

            If that command is refused or fails, do NOT skip the summary
            silently: report the failure and its exact error in an inline
            comment, so a broken review is visible instead of looking like a
            clean bill of health.

            Only after that add inline comments for concrete findings at the
            affected line (GitHub inline comment tool). That way the summary
            survives if the run is cut off. Report only problems you can show
            in the diff; no speculation, no style nitpicking. If there is
            nothing substantial, say so briefly.

            Important: do the review YOURSELF, no subagents, nothing in the
            background. Background agents are cleaned up when your turn ends
            and their results are lost; the summary and the inline comments
            must be posted BEFORE you end your turn.
          claude_args: |
            --model claude-fable-5
            --max-turns 100
            --disallowedTools "Task,Agent,Bash(gh pr review --approve:*),Bash(gh pr review --request-changes:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review --comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Read,Grep,Glob"
